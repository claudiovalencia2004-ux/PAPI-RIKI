
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport"
 content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0b1220">
<title>PAPI RIKI | Prueba Push</title>
<style>
:root{
 font-family:system-ui,-apple-system,sans-serif;
 color-scheme:dark;
 background:#0b1220;
 color:#edf2fa;
}
*{box-sizing:border-box}
body{
 margin:0;
 min-height:100vh;
 padding:24px 16px;
}
main{
 max-width:460px;
 margin:35px auto;
}
h1{
 color:#38d9a9;
 font-size:28px;
}
p{
 color:#aab8ca;
 line-height:1.6;
}
.card{
 background:#17243a;
 border:1px solid #34465e;
 border-radius:20px;
 padding:24px;
 margin-top:20px;
}
label{
 display:block;
 margin:15px 0;
}
input{
 width:100%;
 font:inherit;
 font-size:16px;
 padding:14px;
 margin-top:8px;
 background:#0b1220;
 border:1px solid #52647d;
 border-radius:10px;
 color:white;
}
button{
 display:block;
 width:100%;
 border:0;
 border-radius:12px;
 background:#38d9a9;
 color:#09241d;
 font:inherit;
 font-weight:750;
 padding:16px;
 margin-top:15px;
 cursor:pointer;
}
button:disabled{
 opacity:.5;
 cursor:wait;
}
.secondary{
 background:#293d56;
 color:white;
}
#result{
 white-space:pre-wrap;
 overflow-wrap:anywhere;
}
.success{color:#38d9a9}
.error{color:#ff9d9d}
small{color:#9caec5}
</style>
</head>
<body>

<main>
<h1>🔔 PAPI RIKI</h1>
<h2>Prueba de notificaciones</h2>

<p>
Esta página envía una notificación de prueba
a los dispositivos registrados en tu cuenta.
</p>

<section class="card">
 <h3>🔐 Acceso seguro</h3>

 <div id="loginBox">
  <form id="loginForm">
   <label>
    Correo de PAPI RIKI
    <input id="email"
     type="email"
     autocomplete="username"
     required>
   </label>

   <label>
    Contraseña
    <input id="password"
     type="password"
     autocomplete="current-password"
     required>
   </label>

   <button id="loginButton" type="submit">
    Iniciar sesión
   </button>
  </form>
 </div>

 <div id="testBox" hidden>
  <p class="success">
   Sesión autenticada correctamente.
  </p>

  <button id="sendButton" type="button">
   🔔 Enviar notificación de prueba
  </button>

  <button id="logoutButton"
   class="secondary" type="button">
   Cerrar sesión de prueba
  </button>
 </div>

 <p id="result" role="status"
  aria-live="polite"></p>
</section>

<p>
 <small>
  No muestra ni copia tokens.
  No contiene claves privadas.
  No registra gastos.
 </small>
</p>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>
"use strict";

const SUPABASE_URL =
 "https://kbwrxebdcpgsplfjpkxv.supabase.co";

const SUPABASE_KEY =
 "sb_publishable_khEJIOxXl5ytDpXFABTWcg_hKC0lak2";

const $=id=>document.getElementById(id);

let client=null;
let sending=false;

function message(text,error=false){
 $("result").textContent=text;
 $("result").className=error?"error":"success";
}

function showAuthenticated(value){
 $("loginBox").hidden=value;
 $("testBox").hidden=!value;
}

async function initialize(){
 if(!window.supabase){
  message("No se pudo cargar Supabase.",true);
  return;
 }

 client=window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY,
  {
   auth:{
    persistSession:false,
    autoRefreshToken:false,
    detectSessionInUrl:false
   }
  }
 );

 message("Inicia sesión para enviar la prueba.");
}

$("loginForm").addEventListener(
 "submit",
 async event=>{
  event.preventDefault();

  const button=$("loginButton");
  button.disabled=true;

  try{
   message("Verificando identidad...");

   const {data,error}=
    await client.auth.signInWithPassword({
     email:$("email").value.trim(),
     password:$("password").value
    });

   if(error)throw error;

   if(!data?.session){
    throw new Error("Sesión no válida.");
   }

   $("password").value="";
   showAuthenticated(true);

   message("Acceso correcto. Ya puedes enviar la prueba.");

  }catch(error){
   message(
    "No se pudo iniciar sesión: "+
    error.message,
    true
   );
  }finally{
   button.disabled=false;
  }
 }
);

$("sendButton").addEventListener(
 "click",
 async()=>{
  if(sending)return;

  sending=true;
  $("sendButton").disabled=true;

  try{
   message("Enviando notificación...");

   const {data,error}=
    await client.auth.getSession();

   if(error||!data?.session?.access_token){
    throw new Error(
     "La sesión caducó. Vuelve a iniciar sesión."
    );
   }

   const response=await fetch(
    "/api/push-test",
    {
     method:"POST",
     headers:{
      "Authorization":
       "Bearer "+data.session.access_token,
      "Content-Type":"application/json"
     },
     body:JSON.stringify({})
    }
   );

   const result=await response.json();

   if(!response.ok||!result.ok){
    throw new Error(
     result.message||
     "El servidor rechazó el envío."
    );
   }

   message(
    "¡Solicitud aceptada por el servicio push!\n"+
    "Enviadas: "+result.sent+"\n"+
    "Fallidas: "+result.failed+"\n\n"+
    "Comprueba las notificaciones de tu iPhone."
   );

  }catch(error){
   message(
    "Error: "+error.message,
    true
   );
  }finally{
   sending=false;
   $("sendButton").disabled=false;
  }
 }
);

$("logoutButton").addEventListener(
 "click",
 async()=>{
  await client.auth.signOut();
  showAuthenticated(false);
  message("Sesión de prueba cerrada.");
 }
);

initialize();
</script>
</body>
</html>
